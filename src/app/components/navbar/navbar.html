<div class="fixed top-4 w-full z-50 px-4 sm:px-6 lg:px-8 pointer-events-none">
  <nav class="pointer-events-auto max-w-7xl mx-auto transition-all duration-300 bg-[#f5efe6] shadow-lg rounded-full border border-burgundy/10">
    <div class="flex justify-between items-center h-16 lg:h-[72px] px-6 lg:px-8 gap-6">

      <!-- Mobile menu button -->
      <div class="flex items-center lg:hidden">
        <button (click)="toggleMobileMenu()"
          class="inline-flex items-center justify-center p-2 rounded-md text-charcoal hover:text-burgundy focus:outline-none transition-colors">
          <lucide-icon [img]="isMobileMenuOpen ? X : Menu" class="h-6 w-6"></lucide-icon>
        </button>
      </div>

      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center justify-center lg:justify-start flex-1 lg:flex-none">
        <a routerLink="/" class="flex items-center justify-center h-12 lg:h-14 px-4 bg-[#f1ebd9] rounded-full overflow-hidden shadow-inner">
          <img src="/logoimage/IMG_7291.JPG.jpeg" alt="CURVES Logo"
            class="h-14 lg:h-16 w-auto object-contain mix-blend-multiply scale-125" />
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden lg:flex lg:space-x-5 xl:space-x-8 items-center h-full">
        <a *ngFor="let link of navLinks" [routerLink]="link.path" 
          routerLinkActive="text-burgundy !border-burgundy"
          [routerLinkActiveOptions]="{exact: link.path === '/'}"
          class="whitespace-nowrap text-[15px] font-semibold text-charcoal/80 hover:text-burgundy transition-colors duration-300 py-1 border-b-2 border-transparent">
          {{ link.label }}
        </a>
      </div>

      <!-- Right side icons -->
      <div class="flex items-center">
        <div class="flex items-center space-x-4 lg:space-x-5 border border-burgundy/30 rounded-full px-5 py-2 hidden sm:flex">
          <button (click)="toggleSearch()" class="text-charcoal hover:text-burgundy transition-colors duration-200" [ngClass]="{'text-burgundy': isSearchOpen}">
            <lucide-icon [img]="isSearchOpen ? X : Search" class="h-5 w-5"></lucide-icon>
          </button>
          <button class="text-charcoal hover:text-burgundy transition-colors duration-200">
            <lucide-icon [img]="User" class="h-5 w-5"></lucide-icon>
          </button>
          <button routerLink="/wishlist"
            class="text-charcoal hover:text-burgundy transition-colors duration-200 relative">
            <lucide-icon [img]="Heart" class="h-5 w-5"></lucide-icon>
            <span *ngIf="wishlist().length > 0"
              class="absolute -top-2 -right-2 bg-burgundy text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center">{{
              wishlist().length }}</span>
          </button>
          <button routerLink="/cart"
            class="text-charcoal hover:text-burgundy transition-colors duration-200 relative">
            <lucide-icon [img]="ShoppingBag" class="h-5 w-5"></lucide-icon>
            <span *ngIf="cart().length > 0"
              class="absolute -top-2 -right-2 bg-burgundy text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center">{{
              cart().length }}</span>
          </button>
        </div>
        
        <!-- Mobile cart icon -->
        <button routerLink="/cart" class="text-charcoal hover:text-burgundy sm:hidden relative">
          <lucide-icon [img]="ShoppingBag" class="h-6 w-6"></lucide-icon>
          <span *ngIf="cart().length > 0"
            class="absolute -top-1 -right-1 bg-burgundy text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center">{{
            cart().length }}</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Live Search Overlay -->
  <div class="lg:absolute lg:top-20 lg:right-6 lg:w-[400px] w-full max-w-7xl mx-auto overflow-hidden transition-all duration-300 ease-in-out bg-[#f5efe6] lg:rounded-2xl rounded-b-3xl shadow-xl pointer-events-auto border border-burgundy/10"
    [ngClass]="isSearchOpen ? 'max-h-[600px] opacity-100 mt-2 lg:mt-0' : 'max-h-0 opacity-0 mt-0'">
    <div class="p-4 border-b border-burgundy/10">
      <div class="relative">
        <lucide-icon [img]="Search" class="h-5 w-5 absolute left-3 top-1/2 -translate-y-1/2 text-charcoal/50"></lucide-icon>
        <input type="text" [(ngModel)]="searchQuery" placeholder="Search dresses, collections..." 
          class="w-full pl-10 pr-4 py-3 bg-white rounded-xl text-charcoal placeholder-charcoal/40 focus:outline-none focus:ring-2 focus:ring-burgundy/20 transition-all border border-transparent focus:border-burgundy/30"
          autofocus />
      </div>
    </div>
    
    <div class="max-h-[400px] overflow-y-auto custom-scrollbar">
      <div *ngIf="searchQuery && searchResults.length === 0" class="p-6 text-center text-charcoal/60">
        No results found for "{{ searchQuery }}"
      </div>
      
      <div *ngIf="searchQuery && searchResults.length > 0" class="p-2 space-y-1">
        <button *ngFor="let p of searchResults" (click)="goToProduct(p.id)" class="w-full flex items-center gap-4 p-2 hover:bg-white rounded-xl transition-colors text-left group">
          <img [src]="p.image" class="w-12 h-16 object-cover rounded-lg bg-gray-100" />
          <div class="flex-1">
            <h4 class="text-sm font-bold text-charcoal group-hover:text-burgundy transition-colors">{{ p.name }}</h4>
            <p class="text-xs text-charcoal/60">{{ p.category }}</p>
          </div>
          <div class="text-sm font-bold text-charcoal">
            ₹{{ p.discountPrice || p.price }}
          </div>
        </button>
      </div>
      
      <div *ngIf="!searchQuery" class="p-6">
        <h3 class="text-xs font-bold text-charcoal/50 uppercase tracking-widest mb-3">Popular Searches</h3>
        <div class="flex flex-wrap gap-2">
          <button (click)="searchQuery = 'Maxi'" class="px-3 py-1.5 bg-white text-xs font-bold text-charcoal rounded-lg hover:bg-burgundy hover:text-white transition-colors border border-burgundy/10">Maxi Dresses</button>
          <button (click)="searchQuery = 'Floral'" class="px-3 py-1.5 bg-white text-xs font-bold text-charcoal rounded-lg hover:bg-burgundy hover:text-white transition-colors border border-burgundy/10">Floral Patterns</button>
          <button (click)="searchQuery = 'Premium'" class="px-3 py-1.5 bg-white text-xs font-bold text-charcoal rounded-lg hover:bg-burgundy hover:text-white transition-colors border border-burgundy/10">Premium Collection</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile menu dropdown -->
  <div class="lg:hidden overflow-hidden transition-all duration-300 ease-in-out bg-[#f5efe6] border-t border-burgundy/10 rounded-b-3xl mx-auto max-w-7xl shadow-xl pointer-events-auto"
    [ngClass]="isMobileMenuOpen ? 'max-h-screen opacity-100 mt-2' : 'max-h-0 opacity-0 mt-0'">
    <div class="px-6 pt-2 pb-6 space-y-1">
      <a *ngFor="let link of navLinks" [routerLink]="link.path"
        routerLinkActive="text-burgundy bg-burgundy/5"
        [routerLinkActiveOptions]="{exact: link.path === '/'}" (click)="isMobileMenuOpen = false"
        class="block px-4 py-3 text-base font-semibold text-charcoal/80 hover:bg-burgundy/5 hover:text-burgundy transition-colors rounded-xl">
        {{ link.label }}
      </a>
      <div class="border-t border-burgundy/10 pt-4 mt-4 flex items-center px-4 space-x-4">
        <button class="flex items-center text-charcoal/80 hover:text-burgundy transition-colors">
          <lucide-icon [img]="User" class="h-5 w-5 mr-3"></lucide-icon>
          Sign In
        </button>
      </div>
    </div>
  </div>
</div>
